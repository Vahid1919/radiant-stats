<div class="flex gap-2">
  @for (label of labels; track label) {
    <button
      hlmBtn
      [variant]="variant"
      class="group relative overflow-visible text-gray-400 transition-all duration-200 hover:bg-transparent hover:text-white hover:drop-shadow-[0_0_8px_rgba(255,255,255,0.8)]"
    >
      {{ label }}
      <span
        class="absolute bottom-0 left-1/2 h-px w-0 -translate-x-1/2 bg-white drop-shadow-[0_0_4px_rgba(255,255,255,0.9)] transition-all duration-300 group-hover:w-3/5"
      ></span>
    </button>
  }
</div>
